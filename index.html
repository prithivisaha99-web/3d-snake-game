<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SNAKE 3D — Neon Arcade Garden</title>
    <link rel="stylesheet" href="welcome.css">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- 3D WebGL Background Canvas -->
    <div id="canvas-container"></div>
    <div class="ambient-vignette"></div>

    <!-- UI Overlay -->
    <div class="ui-container">
        <!-- Top Navigation Bar -->
        <header class="top-nav">
            <div class="brand-badge">
                <div class="brand-icon"></div>
                <span class="brand-text">CYBER-SERPENT 3D</span>
            </div>

            <div class="top-actions">
                <div class="high-score-badge">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    <span>BEST: <strong id="high-score-val">0</strong></span>
                </div>

                <button class="icon-btn" id="sound-toggle" title="Toggle Sound" aria-label="Toggle Sound">
                    <svg id="sound-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M11 5L6 9H2V15H6L11 19V5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <button class="icon-btn" id="info-toggle" title="How to Play" aria-label="How to Play">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Center Hero Content -->
        <main class="hero-content">
            <p class="title-tagline">3D ARCADE EVOLUTION</p>
            <h1 class="game-title">SNAKE GAME</h1>
            <p class="subtitle">
                Enter the <strong>Neon Garden</strong>. Slither through glowing 3D worlds, collect power-ups, defeat obstacles, and dominate the leaderboard!
            </p>

            <!-- Active Configuration Chips -->
            <div class="active-config-bar">
                <div class="config-chip" id="chip-mode">🎮 Mode: <strong>Classic</strong></div>
                <div class="config-chip" id="chip-diff">⚡ Difficulty: <strong>Normal</strong></div>
                <div class="config-chip" id="chip-skin">🐍 Skin: <strong>Emerald</strong></div>
                <div class="config-chip" id="chip-world">🌍 World: <strong>Neon Garden</strong></div>
            </div>

            <div class="cta-group">
                <a href="game.html" class="btn-start-game" id="start-game-btn">
                    START GAME
                    <div class="btn-pulse-ring"></div>
                </a>
            </div>

            <!-- Hub Feature Menu Buttons -->
            <div class="hub-menu-grid">
                <button class="hub-btn" id="btn-hub-modes">
                    <span class="hub-btn-icon">🎮</span>
                    <span>Modes</span>
                </button>
                <button class="hub-btn" id="btn-hub-diff">
                    <span class="hub-btn-icon">⚡</span>
                    <span>Difficulty</span>
                </button>
                <button class="hub-btn" id="btn-hub-skins">
                    <span class="hub-btn-icon">🐍</span>
                    <span>Skins</span>
                </button>
                <button class="hub-btn" id="btn-hub-worlds">
                    <span class="hub-btn-icon">🌍</span>
                    <span>Worlds</span>
                </button>
                <button class="hub-btn" id="btn-hub-daily">
                    <span class="hub-btn-icon">📅</span>
                    <span>Daily</span>
                </button>
                <button class="hub-btn" id="btn-hub-achievements">
                    <span class="hub-btn-icon">🏆</span>
                    <span>Awards</span>
                </button>
                <button class="hub-btn" id="btn-hub-stats">
                    <span class="hub-btn-icon">📊</span>
                    <span>Stats</span>
                </button>
                <button class="hub-btn" id="btn-hub-howto">
                    <span class="hub-btn-icon">❓</span>
                    <span>Rules</span>
                </button>
            </div>
        </main>
    </div>

    <!-- Generic Hub Modal Dialog -->
    <div class="modal-backdrop" id="hub-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">TITLE</h2>
                <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
            </div>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="storage.js"></script>
    <script src="game-state.js"></script>
    <script src="audio.js"></script>
    <script src="welcome.js"></script>
</body>
</html>
