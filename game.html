<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Snake Game Arena</title>
    <link rel="stylesheet" href="game.css">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- 3D Three.js Game Canvas Container -->
    <div id="game-canvas-container"></div>
    <div class="ambient-overlay"></div>
    <div class="floating-popups-container" id="floating-popups"></div>

    <!-- UI Overlay Layer -->
    <div class="game-ui">
        <!-- Top HUD Bar -->
        <header class="hud-bar">
            <!-- Left Info Cards -->
            <div class="hud-group">
                <!-- Score -->
                <div class="hud-card score-card">
                    <div class="hud-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                    </div>
                    <div>
                        <div class="hud-label">Score</div>
                        <div class="hud-value" id="score-val">0</div>
                    </div>
                </div>

                <!-- High Score -->
                <div class="hud-card highscore-card">
                    <div class="hud-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                            <path d="M4 22h16"></path>
                            <path d="M10 14.66V17c0 .55-.45 1-1 1H7.5a1.5 1.5 0 0 1-1.5-1.5V14.66"></path>
                            <path d="M14 14.66V17c0 .55.45 1 1 1h1.5a1.5 1.5 0 0 0 1.5-1.5V14.66"></path>
                            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
                        </svg>
                    </div>
                    <div>
                        <div class="hud-label">Best</div>
                        <div class="hud-value" id="highscore-val">0</div>
                    </div>
                </div>

                <!-- Time -->
                <div class="hud-card">
                    <div class="hud-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                    <div>
                        <div class="hud-label">Time</div>
                        <div class="hud-value" id="time-val">00:00</div>
                    </div>
                </div>

                <!-- Speed -->
                <div class="hud-card">
                    <div class="hud-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3e635" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                        </svg>
                    </div>
                    <div>
                        <div class="hud-label">Speed</div>
                        <div class="hud-value" id="speed-val">1.0x</div>
                    </div>
                </div>
            </div>

            <!-- Right Controls -->
            <div class="hud-actions">
                <button class="btn-hud icon-only" id="btn-pause" title="Pause Game (Space)" aria-label="Pause Game">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                        <rect x="14" y="4" width="4" height="16" rx="1"></rect>
                    </svg>
                </button>

                <button class="btn-hud" id="btn-restart" title="Restart Game">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1 4 1 10 7 10"></polyline>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                    </svg>
                    <span>RESTART</span>
                </button>

                <button class="btn-hud icon-only" id="sound-toggle" title="Toggle Sound" aria-label="Toggle Sound">
                    <svg id="sound-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M11 5L6 9H2V15H6L11 19V5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <a href="index.html" class="btn-hud icon-only" title="Return to Menu" aria-label="Return to Menu">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </a>
            </div>
        </header>

        <!-- Mobile Touch D-Pad -->
        <div class="touch-controls">
            <div class="dpad-grid">
                <button class="dpad-btn dpad-up" id="dpad-up" aria-label="Up">▲</button>
                <button class="dpad-btn dpad-left" id="dpad-left" aria-label="Left">◀</button>
                <button class="dpad-btn dpad-down" id="dpad-down" aria-label="Down">▼</button>
                <button class="dpad-btn dpad-right" id="dpad-right" aria-label="Right">▶</button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal Overlay -->
    <div class="overlay-screen" id="game-over-modal">
        <div class="modal-box">
            <div class="modal-glow-edge"></div>
            <h2 class="game-over-title">GAME OVER</h2>
            <p class="game-over-reason" id="game-over-reason">You collided with the barrier wall!</p>

            <div id="new-record-badge" class="new-record-badge" style="display: none;">
                ★ NEW HIGH SCORE ★
            </div>

            <div class="score-stats-grid">
                <div class="stat-item">
                    <div class="stat-title">Final Score</div>
                    <div class="stat-number current" id="final-score">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-title">High Score</div>
                    <div class="stat-number best" id="best-score">0</div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-primary-action" id="btn-play-again">PLAY AGAIN</button>
                <a href="index.html" class="btn-secondary-action">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    </svg>
                    MAIN MENU
                </a>
            </div>
            <p class="modal-hint">Press <strong>Enter</strong> to play again</p>
        </div>
    </div>

    <!-- Pause Modal Overlay -->
    <div class="overlay-screen" id="pause-modal">
        <div class="modal-box">
            <div class="modal-glow-edge"></div>
            <h2 class="pause-title">GAME PAUSED</h2>
            <p class="game-over-reason">Take a breather, neon pilot!</p>

            <div class="modal-actions">
                <button class="btn-primary-action" id="btn-resume">RESUME GAME</button>
                <a href="index.html" class="btn-secondary-action">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    </svg>
                    MAIN MENU
                </a>
            </div>
            <p class="modal-hint">Press <strong>Spacebar</strong> to resume</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="audio.js"></script>
    <script src="game.js"></script>
</body>
</html>
